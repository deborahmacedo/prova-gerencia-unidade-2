name: questao4

on: 
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: testes 
        run: pytest -v

      - name: Check
        run: python -m py_compile src/main.py
  image:
    needs: build
    runs-on: ubuntu-latests
    steps:
      - name: construir imagem 
        run: docker build -t python:ci .
      - name: subir conteiner
        run: docker run -d --name python -p 8080:8080 python:ci

      